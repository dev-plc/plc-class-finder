name: 시트 → DB 동기화

on:
  workflow_dispatch:
    inputs:
      cohort:
        description: '기수 ID (비우면 DB의 활성 기수를 따라감)'
        required: false
        default: ''
      activate:
        description: '이 기수를 활성 기수로 지정 (기수 전환 때만 체크)'
        type: boolean
        required: false
        default: false
      homework_since:
        description: '과제 기준일 YYYY-MM-DD (비우면 지난 기수 마지막 강의). 이 날짜 뒤 제출만 이 기수 것으로 본다'
        required: false
        default: ''
      import_attendance:
        description: '빈칸까지 덮어쓰기 (기수 첫 구축용) — 출석은 체크하지 않아도 늘 들어옵니다. 켜면 시트에서 비운 칸이 DB 에서도 지워지고, 아직 하지 않은 강의의 O 는 ◎ 로 들어갑니다'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'dry-run (쓰기 없이 확인만)'
        type: boolean
        required: false
        default: false
  schedule:
    # 매일 03:00 UTC = 12:00 KST. Supabase 7일 pause 방지 겸용
    - cron: '0 3 * * *'

concurrency:
  group: sync-db
  cancel-in-progress: false

# 실패를 이슈로 남기기 위해 필요하다
permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 의존성 설치
        run: npm ci || npm install

      - name: 동기화 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GAS_API_URL: ${{ secrets.GAS_API_URL }}
          COHORT_ID: ${{ github.event.inputs.cohort }}
          HOMEWORK_SINCE: ${{ github.event.inputs.homework_since }}
        run: |
          FLAGS=""
          if [ -n "$HOMEWORK_SINCE" ]; then
            FLAGS="$FLAGS --homework-since=$HOMEWORK_SINCE"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "${{ github.event.inputs.activate }}" = "true" ]; then
            FLAGS="$FLAGS --activate"
          fi
          if [ "${{ github.event.inputs.import_attendance }}" = "true" ]; then
            FLAGS="$FLAGS --import-attendance"
          fi
          echo "flags:${FLAGS:-(없음)}"
          node scripts/sync-sheet-to-db.mjs $FLAGS

      # 크론이 실패하면 아무도 모른다.
      #
      # 2026-08-21 정오 실행이 GAS 404 로 죽었는데, 다음 날 사람이
      # "과제가 안 들어왔다" 고 알아챌 때까지 하루가 그냥 갔다.
      # 조용히 실패하는 것이 실패하는 것보다 나쁘다 — 이슈로 남긴다.
      #
      # 손으로 돌린 실행은 누르는 사람이 결과를 보고 있으니 만들지 않는다.
      - name: 실패를 이슈로 남긴다
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '⚠️ 일 1회 동기화 실패';
            const body = [
              `[실행 로그](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '시트의 명단·편성·위치·과제·김밥이 DB 로 들어오지 못했습니다.',
              '앱 화면은 마지막으로 성공한 동기화 시점에 멈춰 있습니다.',
              '',
              '**출석은 영향받지 않습니다** — 10분 트리거가 따로 밀어 올립니다.',
              '',
              '자주 나오는 원인:',
              '- `GAS 응답 실패: HTTP 404` — 웹앱을 "새 배포" 로 만들어 URL 이 바뀌었다.',
              '  Apps Script → 배포 관리 에서 URL 을 복사해 `GAS_API_URL` 시크릿을 갱신하세요.',
              '- `HTTP 401 / 403` — 배포의 액세스 권한이 "모든 사용자" 가 아니다.',
              '- Supabase 가 pause 됐다 — 대시보드에서 깨우세요.',
              '',
              '급하면 관리자 화면의 **⟳ 시트에서 지금 가져오기** 로 즉시 돌릴 수 있습니다.',
              '',
              '다음 크론이 성공하면 이 이슈는 저절로 닫힙니다.',
            ].join('\n');

            // 이미 열린 이슈가 있으면 새로 만들지 않고 덧붙인다 —
            // 며칠 이어서 실패하면 이슈가 며칠치 쌓인다
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'sync-failure', per_page: 1,
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['sync-failure'],
              });
            }

      # 다시 성공하면 열려 있던 실패 이슈를 닫는다.
      # 사람이 손으로 닫아야 하면 언젠가 안 닫힌 채 남고, 그때부터
      # 이슈가 열려 있다는 것이 아무 뜻도 없어진다.
      - name: 회복되면 실패 이슈를 닫는다
        if: success() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'sync-failure', per_page: 20,
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: `✅ 동기화가 다시 성공했습니다 ([실행 로그](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})).`,
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number,
                state: 'closed', state_reason: 'completed',
              });
            }
