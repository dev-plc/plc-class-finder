<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PL교회 교리교육 관리자</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

    <link rel="stylesheet" href="style.css?v=114">
    <link rel="stylesheet" href="admin.css?v=114">
</head>
<body>
    <div class="admin-container">
        <!-- 헤더 -->
        <header class="admin-header">
            <div class="admin-header-content">
                <div class="admin-brand">
                    <div class="admin-logo">PLC</div>
                    <span class="admin-badge">관리자 모드</span>
                </div>
                <div class="admin-controls">
                    <div class="theme-toggle-wrapper">
                        <svg class="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <button class="theme-toggle" id="themeToggle" aria-label="테마 전환">
                            <div class="toggle-track">
                                <div class="toggle-thumb"></div>
                            </div>
                        </button>
                    </div>
                    <button class="logout-btn" id="logoutBtn" aria-label="로그아웃" title="로그아웃">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        <span class="logout-text">로그아웃</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- 탭 네비게이션 -->
        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="members">개인별 보기</button>
            <button class="tab-btn" data-tab="teams">조별 보기</button>
            <button class="tab-btn" data-tab="attendance">출석 관리</button>
            <button class="tab-btn" data-tab="absence">결석 현황</button>
            <button class="tab-btn" data-tab="completion">수료 현황</button>
            <button class="tab-btn" data-tab="print">출석부 출력</button>
        </nav>

        <!-- 시트에서 지금 가져오기 -->
        <div class="sync-bar">
            <button type="button" id="syncBtn" class="sync-btn">⟳ 시트에서 지금 가져오기</button>
            <button type="button" id="reloadBtn" class="sync-sub-btn">화면 새로 고침</button>
            <!-- 저절로 되는 것을 먼저 적는다. ⟳ 가 필요한 것만 적어 두었더니
                 시트에서 고친 출석이 [화면 새로 고침] 만으로 보이는 것을 두고
                 "새로 고침이 시트를 부르나" 하는 오해가 났다.
                 '(⟳ 와 무관)' 을 붙인 이유: 출석을 올리는 pushAttendanceToDb 는
                 시트에 붙은 GAS 프로젝트에 있고, 웹앱(doPost)은 별도 프로젝트라
                 부를 수가 없다. ⟳ 로 출석까지 당기려던 시도(GAS v32)를 물린 자리다. -->
            <span class="sync-info" id="syncInfo">출석은 10분마다 저절로 들어옵니다 (⟳ 와 무관). 그 밖에는 하루 한 번(정오) — 방금 시트에서 고치셨다면 ⟳ 를 눌러 주세요.</span>
        </div>

        <!-- 출석 관리 (DB 가 원본. 시트에서 고치지 않는다) -->
        <div class="tab-content" id="attendanceTab">
            <div class="att-picker">
                <div class="att-field">
                    <label for="attSession">주차</label>
                    <select id="attSession"></select>
                </div>
                <div class="att-field">
                    <label for="attTeam">조</label>
                    <select id="attTeam"></select>
                </div>
            </div>

            <div class="att-meta" id="attMeta"></div>

            <div class="att-toolbar">
                <div class="att-bulk">
                    <button type="button" class="att-bulk-btn" data-bulk="O">전체 출석</button>
                    <button type="button" class="att-bulk-btn" data-bulk="fillX">빈칸 → 결석</button>
                    <button type="button" class="att-bulk-btn" data-bulk="clear">전체 지우기</button>
                    <button type="button" class="att-bulk-btn ghost" data-bulk="reset">되돌리기</button>
                </div>
                <div class="att-counts" id="attCounts"></div>
            </div>

            <div class="att-list" id="attList"></div>

            <div class="att-savebar" id="attSaveBar">
                <span class="att-save-info" id="attSaveInfo">변경 사항 없음</span>
                <button type="button" id="attSaveBtn" class="att-save-btn" disabled>저장</button>
            </div>
        </div>

        <!-- 결석 현황
             결석(X)만 센다. 기준 주차까지만 센다 — 아직 하지 않은 수업은 결석이 아니다.
             (지난 기수 참석자의 시트에 앞 주차 X 가 미리 들어 있어 4회로 잡힌 적이 있다) -->
        <div class="tab-content" id="absenceTab">
            <div class="ab-panel">
                <div class="ab-row">
                    <div class="ab-field">
                        <label for="abSession">주차</label>
                        <select id="abSession"></select>
                    </div>
                    <div class="ab-field">
                        <label for="abTeam">조</label>
                        <select id="abTeam"></select>
                    </div>
                    <div class="ab-field">
                        <label for="abPastor">담당교역자</label>
                        <select id="abPastor"></select>
                    </div>
                    <div class="ab-field">
                        <label for="abSort">정렬</label>
                        <div class="ab-sort">
                            <select id="abSort"></select>
                            <button type="button" id="abDir" class="ab-dir"></button>
                        </div>
                    </div>
                </div>
            </div>

            <section class="ab-card">
                <div class="ab-card-head">
                    <h3>이 주차 결석자</h3>
                    <span class="ab-badge" id="abWeekBadge"></span>
                    <button type="button" class="ab-copy" data-copy="week">📋 명단 복사</button>
                </div>
                <p class="ab-note" id="abWeekNote"></p>
                <div class="ab-list" id="abWeekList"></div>
            </section>

            <section class="ab-card">
                <div class="ab-card-head">
                    <h3>누적 결석자</h3>
                    <span class="ab-badge" id="abTotalBadge"></span>
                    <div class="ab-thresholds" id="abThresholds"></div>
                    <button type="button" class="ab-copy" data-copy="total">📋 명단 복사</button>
                </div>
                <p class="ab-note" id="abTotalNote"></p>
                <div class="ab-list" id="abTotalList"></div>
            </section>
        </div>

        <!-- 수료 현황
             결석 현황이 '지금 문제인 사람' 이라면 여기는 '끝까지 갈 사람' 이다.
             판정 숫자는 전부 v_completion_status 에서 온다 (규칙은 SQL 한 곳에만).
             여기서 더하는 것은 '앞으로 남은 강의가 몇 회인가' 하나뿐이다 —
             그건 판정이 아니라 달력이다. -->
        <div class="tab-content" id="completionTab">
            <div class="ab-panel">
                <div class="ab-row">
                    <div class="ab-field">
                        <label for="cpTeam">조</label>
                        <select id="cpTeam"></select>
                    </div>
                    <div class="ab-field">
                        <label for="cpPastor">담당교역자</label>
                        <select id="cpPastor"></select>
                    </div>
                    <div class="ab-field">
                        <label for="cpSort">정렬</label>
                        <div class="ab-sort">
                            <select id="cpSort"></select>
                            <button type="button" id="cpDir" class="ab-dir"></button>
                        </div>
                    </div>
                </div>
            </div>

            <section class="ab-card">
                <div class="ab-card-head">
                    <h3>한눈에</h3>
                    <span class="ab-badge" id="cpBadge"></span>
                </div>
                <p class="ab-note" id="cpWarn"></p>
                <div class="cp-buckets" id="cpBuckets"></div>
            </section>

            <section class="ab-card">
                <div class="ab-card-head">
                    <h3 id="cpListTitle">명단</h3>
                    <span class="ab-badge" id="cpListBadge"></span>
                    <!-- 갈래 안을 한 번 더 가른다. 무엇으로 가르는지는 갈래마다 다르다 —
                         수료 예정은 '몇 회 더', 아슬아슬은 '과제 몇 건'. (CP_SUB_AXIS) -->
                    <div class="ab-thresholds" id="cpNeeds"></div>
                    <button type="button" class="ab-copy" data-copy="cp">📋 명단 복사</button>
                </div>
                <p class="ab-note" id="cpNote"></p>
                <div class="ab-list" id="cpList"></div>
            </section>
        </div>

        <!-- 출석부 출력 (인쇄용) -->
        <div class="tab-content" id="printTab">
            <div class="pr-panel">
                <div class="pr-row">
                    <div class="pr-field">
                        <label for="prSession">주차</label>
                        <select id="prSession"></select>
                    </div>
                    <div class="pr-field">
                        <label for="prTeam">조 · 장소로 이동</label>
                        <select id="prTeam"></select>
                    </div>
                </div>

                <!-- 항목 · 출력 · 인쇄를 한 줄에. 자리가 모자라면 알아서 접힌다.
                     조작부가 두꺼우면 아래 출석부를 보기 불편하다.

                     순서는 실제로 하는 일의 차례다 — 무엇을 넣을지(항목) 고르고,
                     몇 장을 뽑을지(출력) 정하고, 몇 장인지 확인한 뒤, 마지막에 누른다.
                     인쇄가 맨 앞에 있으면 아직 안 고른 채로 먼저 눌리게 된다. -->
                <div class="pr-row pr-bar">
                    <span class="pr-group">
                        <span class="pr-row-label">항목</span>
                        <label class="pr-chip"><input type="checkbox" id="prKimbapStatus" checked><span>김밥 현황</span></label>
                        <label class="pr-chip"><input type="checkbox" id="prKimbap"><span>김밥신청</span></label>
                        <label class="pr-chip"><input type="checkbox" id="prHomework"><span>과제</span></label>
                        <label class="pr-chip"><input type="checkbox" id="prMemo" checked><span>메모</span></label>
                        <label class="pr-chip"><input type="checkbox" id="prSummary" checked><span>집계표</span></label>
                    </span>

                    <span class="pr-group">
                        <span class="pr-row-label">출력</span>
                        <button type="button" id="prPickToggle" class="pr-sub-btn">전체 해제</button>
                        <div class="pr-pick-menu">
                            <button type="button" id="prPickSomeBtn" class="pr-sub-btn"
                                    aria-expanded="false" aria-controls="prPagePicks">부분 선택 ▾</button>
                            <div class="pr-page-picks" id="prPagePicks" hidden></div>
                        </div>
                    </span>

                    <span class="pr-info" id="prInfo"></span>

                    <button type="button" id="prPrintBtn" class="pr-print-btn">🖨️ 인쇄</button>
                </div>
                <div class="pr-hint" id="prHint"></div>
            </div>

            <div class="pr-preview" id="prPreview"></div>
        </div>

        <!-- 조별 보기 -->
        <div class="tab-content" id="teamsTab">
            <div class="filter-section">
                <input 
                    type="text" 
                    id="teamFilter" 
                    class="filter-input" 
                    placeholder="조 이름 또는 위치로 검색..."
                    autocomplete="off"
                >
            </div>
            <div class="teams-grid" id="teamsGrid">
                <!-- 조별 카드들이 여기에 동적으로 생성됩니다 -->
            </div>
        </div>

        <!-- 개인별 보기 -->
        <div class="tab-content active" id="membersTab">
            <div class="filter-section">
                <input 
                    type="text" 
                    id="memberFilter" 
                    class="filter-input" 
                    placeholder="이름, 조, 위치로 검색..."
                    autocomplete="off"
                >
            </div>
            <div class="members-grid" id="membersGrid">
                <!-- 개인 카드들이 여기에 동적으로 생성됩니다 -->
            </div>
        </div>
    </div>

    <!-- 조원 목록 모달 -->
    <div class="team-modal" id="teamModal">
        <div class="team-modal-content">
            <div class="team-modal-header">
                <h2 id="teamModalTitle">조원 목록</h2>
                <button class="team-modal-close" id="teamModalClose">✕</button>
            </div>
            <div class="team-members-list" id="teamMembersList">
                <!-- 조원 카드들이 여기에 동적으로 생성됩니다 -->
            </div>
        </div>
    </div>

    <!-- 개인 상세 — 카드를 누르면 뜬다.
         출석·김밥·과제를 한 화면에서 본다. 최근 것부터, 나머지는 접어 둔다. -->
    <div class="md-modal" id="memberModal" aria-hidden="true">
        <div class="md-inner" role="dialog" aria-modal="true" aria-labelledby="mdTitle">
            <div class="md-head">
                <h2 id="mdTitle"></h2>
                <button type="button" class="md-close" id="mdClose" aria-label="닫기">✕</button>
            </div>
            <div class="md-body" id="mdBody"></div>
        </div>
    </div>

    <!-- 조 전체 출석표 — 조 카드의 '📊 출석부' 로 연다.
         튜터가 보는 것(index.html)과 같은 표다. 그리는 코드도 같다
         (scripts/attendance-matrix.js). 두 화면이 다르게 보이면 대조가 안 된다. -->
    <div class="matrix-modal" id="matrixModal" aria-hidden="true">
        <div class="matrix-modal-inner" role="dialog" aria-modal="true" aria-labelledby="matrixTitle">
            <div class="matrix-modal-header">
                <h3 id="matrixTitle">조 전체 현황</h3>
                <button type="button" id="matrixCloseBtn" class="matrix-close-btn" aria-label="닫기">✕</button>
            </div>
            <div class="matrix-legend">
                <span><b>O</b> 출석</span><span><b>◎</b> 지난 기수 이수</span>
                <span><b>과제</b> 과제+소감문 대체 (출석 인정)</span><span><b>X</b> 결석</span>
                <span><b>·</b> 미기록</span><span><b>−</b> 수업없음</span>
                <span><i class="mx-lg-future"></i> 아직 안 한 수업</span>
                <!-- 📝 는 '그 주차에 제출 기록이 있다' 는 뜻이다. 유형을 안 본다
                     (attendance-matrix.js 의 homeworkForSession 은 주차로만 거른다).
                     한때 '📝 과제+소감문' 이라고 적었는데, 과제만 낸 것에도 뜨므로
                     틀린 말이었다. 인정 여부를 가르는 것은 이 배지가 아니라 '과제' 칸이다. -->
                <span>🍙 김밥</span><span>📝 과제 제출</span>
                <button type="button" id="matrixFoldBtn" class="matrix-fold-btn"
                        aria-expanded="false" style="display:none;"></button>
            </div>
            <div class="matrix-scroll" id="matrixScroll"></div>
        </div>
    </div>

    <script type="module" src="admin.js?v=114"></script>
</body>
</html>
