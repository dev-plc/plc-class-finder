<body>
    <div class="container">
        <h1>📋 교리교육 출석부 생성기</h1>
        <p class="subtitle">CSV 파일을 업로드하면 조별 출석부가 자동으로 생성됩니다</p>

        <div class="upload-section">

                </div>
            </div>
            
            <!-- 김밥 계수 모드일 때만 보이는 교역자 설정 -->

                    <span style="color: #555; font-weight: 500;">👔 교역자:</span>
                    <label style="display: flex; align-items: center; gap: 6px; color: #666;">
                        칼빈
                        <input type="number" id="calvinStaffCount" value="" min="0" placeholder="0" style="width: 45px; padding: 4px 6px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; text-align: center; transition: all 0.2s;">
                    </label>
                    <label style="display: flex; align-items: center; gap: 6px; color: #666;">
                        웨슬리
                        <input type="number" id="wesleyStaffCount" value="" min="0" placeholder="0" style="width: 45px; padding: 4px 6px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; text-align: center; transition: all 0.2s;">
                    </label>
                </div>
            </div>
            
            <style>
                #staffSettings input[type="number"]:focus {
                    outline: none;
                    border-color: #4CAF50;
                    box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.1);
                }
                
                #staffSettings input[type="number"]:hover {
                    border-color: #bbb;
                }
            </style>
            
            <div class="file-input-wrapper">
                <input type="file" id="csvFile" accept=".csv" multiple />
                <button class="btn btn-primary" onclick="loadCSV()">📁 CSV 파일 불러오기 (여러 개 선택 가능)</button>
            </div>
            <div class="info-box" id="fileInfo" style="display: none;">
                <strong>파일 정보:</strong> <span id="fileName"></span> | 
                <strong>총 조 수:</strong> <span id="teamCount"></span>개
            </div>
        </div>

        <div class="controls" id="controls" style="display: none;">
            <button class="btn btn-print" onclick="printAll()">🖨️ 전체 인쇄</button>
            <button class="btn btn-download" onclick="downloadAsPDF(this)">📄 PDF 다운로드</button>
            <button class="btn btn-download" onclick="downloadAsImage(this)">🖼️ 이미지 다운로드</button>
            <button class="btn btn-secondary" onclick="selectAllTeams()">전체 선택</button>
            <button class="btn btn-secondary" onclick="deselectAllTeams()">전체 해제</button>
            <button class="btn btn-print" onclick="printSelected()">선택한 조만 인쇄</button>
        </div>

    <script>
        let teamsData = [];
        let dateHeaders = []; // CSV에서 파싱한 날짜 헤더
        let currentMode = 'attendance'; // 'attendance' 또는 'lunch'

        async function loadCSV() {
            const fileInput = document.getElementById('csvFile');
            const files = fileInput.files;

            if (files.length === 0) {
                alert('CSV 파일을 선택해주세요.');
                return;
            }

            // 여러 파일을 읽어서 텍스트 배열로 저장
            const fileTexts = [];
            const fileNames = [];

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                fileNames.push(file.name);
                
                const text = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.onerror = reject;
                    reader.readAsText(file, 'UTF-8');
                });
                
                fileTexts.push(text);
            }

            // 여러 CSV 파일을 합쳐서 파싱
            parseMultipleCSV(fileTexts, fileNames);
        }

        // CSV 라인을 파싱하는 함수 (쉼표로 분리하되 따옴표 처리)
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        }

        // 여러 CSV 파일을 합쳐서 파싱하는 함수
        function parseMultipleCSV(fileTexts, fileNames) {
            if (fileTexts.length === 0) return;

            // 첫 번째 파일에서 헤더 추출
            const firstLines = fileTexts[0].split('\n');
            let headerLine = '';
            
            for (let line of firstLines) {
                if (line.trim()) {
                    headerLine = line;
                    break;
                }
            }

            // 모든 파일의 데이터 라인을 합침 (헤더 제외)
            let allDataLines = [];
            
            fileTexts.forEach((text, index) => {
                const lines = text.split('\n');
                let isFirstLine = true;
                
                lines.forEach(line => {
                    if (!line.trim()) return;
                    
                    // 첫 번째 줄(헤더)은 건너뛰기
                    if (isFirstLine) {
                        isFirstLine = false;
                        return;
                    }
                    
                    allDataLines.push(line);
                });
            });

            // 헤더 + 합쳐진 데이터로 하나의 CSV 텍스트 생성
            const combinedCSV = headerLine + '\n' + allDataLines.join('\n');
            
            // 기존 parseCSV 함수 호출
            parseCSV(combinedCSV, fileNames);
        }

        function parseCSV(text, fileNames = null) {
            const lines = text.split('\n');
            const teams = {};
            let isFirstLine = true;

            lines.forEach((line, index) => {
                // 빈 줄 스킵
                if (!line.trim()) return;
                
                const parts = parseCSVLine(line);

                // 첫 번째 줄(헤더)에서 날짜 정보 파싱
                if (isFirstLine) {
                    // 헤더: NOTE,Lunch,Location,Team,ID,11/02,11/09,...
                    // 5번째 컬럼(ID) 이후가 날짜들
                    // 빈 문자열을 제거하지 않고 그대로 유지 (출석 데이터와 인덱스 맞추기 위해)
                    dateHeaders = parts.slice(5).map(d => d.trim());
                    // 날짜가 있으면 그대로 사용 (제한하지 않음)
                    // 단, 최대 12주차까지만 사용하도록 제한 (빈 칸으로 채움)
                    const maxWeeks = 12;
                    while (dateHeaders.length < maxWeeks) {
                        dateHeaders.push('');
                    }
                    dateHeaders = dateHeaders.slice(0, maxWeeks);
                    
                    // 디버깅: 헤더 정보 출력
                    console.log('CSV 헤더 파싱:', {
                        dateHeaders: dateHeaders,
                        dateHeadersLength: dateHeaders.length,
                        lastDateIndex: dateHeaders.length - 1,
                        lastDate: dateHeaders[dateHeaders.length - 1]
                    });
                    
                    isFirstLine = false;
                    return;
                }

                if (parts.length < 5) return;

                // CSV 컬럼 구조: NOTE(0), Lunch(1), Location(2), Team(3), ID(4), 출석데이터들(5~)
                const note = parts[0].trim();
                const lunch = parts[1].trim(); // 김밥 여부
                const location = parts[2].trim();
                const team = parts[3].trim();
                const idField = parts[4].trim();

                // 빈 줄 스킵
                if (!location || !team || !idField) return;

                // NOTE가 숫자만 있는 줄은 합계/구분선이므로 스킵
                if (note && /^\d+$/.test(note)) return;

                // 출석 데이터 추출 (5번째 컬럼부터)
                const attendanceData = parts.slice(5).map(d => d.trim());
                // dateHeaders와 동일한 길이로 맞추기 (부족하면 빈 문자열로 채움)
                const maxWeeks = dateHeaders.length || 12;
                while (attendanceData.length < maxWeeks) {
                    attendanceData.push('');
                }
                const attendance = attendanceData.slice(0, maxWeeks);
                
                // 디버깅: [이름]인 경우 상세 정보 출력
                if (idField === '[이름]') {
                    console.log('[이름] CSV 파싱:', {
                        lineIndex: index,
                        parts: parts,
                        partsLength: parts.length,
                        attendanceData: attendanceData,
                        attendance: attendance,
                        dateHeaders: dateHeaders,
                        dateHeadersLength: dateHeaders.length
                    });
                }

                const teamKey = `${location}_${team}`;

                if (!teams[teamKey]) {
                    teams[teamKey] = {
                        location: location,
                        team: team,
                        members: []
                    };
                }

                // ID를 그대로 저장 (이름+전화번호 분리하지 않음)
                teams[teamKey].members.push({
                    id: idField, // ID 그대로 저장
                    note: note || '', // NOTE 저장
                    lunch: lunch || '', // 김밥 여부 저장
                    attendance: attendance // 출석 데이터 저장
                });
            });

            teamsData = Object.values(teams);
            displaySheets();
            displayControls();
        }

        function setMode(mode) {
            currentMode = mode;
            // 버튼 스타일 업데이트
            document.getElementById('modeAttendance').style.background = mode === 'attendance' ? '#2196F3' : '#ccc';
            document.getElementById('modeLunch').style.background = mode === 'lunch' ? '#9C27B0' : '#ccc';
            
            // 교역자 설정 표시/숨김
            document.getElementById('staffSettings').style.display = mode === 'lunch' ? 'block' : 'none';
            
            // body 클래스 업데이트 (화면에서는 필요 없지만 일관성을 위해)
            if (mode === 'lunch') {
                document.body.classList.add('lunch-mode');
            } else {
                document.body.classList.remove('lunch-mode');
            }
            
            // 데이터가 있으면 다시 표시
            if (teamsData.length > 0) {
                displaySheets();
                displayControls();
            }
        }

        function displaySheets() {
            const container = document.getElementById('attendanceSheets');
            container.innerHTML = '';
            container.style.display = 'block';

            // DocumentFragment 사용하여 성능 향상
            const fragment = document.createDocumentFragment();

            if (currentMode === 'attendance') {
                // 일반 출석부 모드
                teamsData.forEach((team, index) => {
                    const sheet = createSheet(team, index);
                    fragment.appendChild(sheet);
                });
            } else {
                // 김밥 계수 모드
                const lunchSheets = createLunchSheets();
                lunchSheets.forEach(sheet => {
                    fragment.appendChild(sheet);
                });
            }

            container.appendChild(fragment);
        }

        // 실제 출석 데이터가 있는 가장 마지막 날짜 열의 인덱스 찾기
        function getLatestDateIndex() {
            if (teamsData.length === 0) return -1;
            
            // 모든 멤버의 attendance를 확인해서 값이 있는 가장 큰 인덱스 찾기
            let maxIndex = -1;
            
            teamsData.forEach(team => {
                team.members.forEach(member => {
                    if (!member.attendance) return;
                    
                    // 각 멤버의 마지막 값이 있는 인덱스 찾기
                    for (let i = member.attendance.length - 1; i >= 0; i--) {
                        const value = member.attendance[i];
                        if (value && value.trim() !== '') {
                            if (i > maxIndex) {
                                maxIndex = i;
                            }
                            break;
                        }
                    }
                });
            });
            
            console.log('가장 마지막 날짜 인덱스 찾기:', {
                maxIndex: maxIndex,
                maxDate: dateHeaders[maxIndex]
            });
            
            return maxIndex;
        }

        // 가장 마지막 날짜 열에 '돌봄'이 있는지 확인
        function isDolbomOnLatestDate(member) {
            // CSV 헤더의 가장 마지막 날짜 인덱스 찾기
            const latestIndex = getLatestDateIndex();
            if (latestIndex === -1) {
                return false;
            }
            
            // 해당 날짜(인덱스)의 attendance 값 확인
            const attendanceValue = member.attendance && member.attendance[latestIndex];
            const isDolbom = attendanceValue && attendanceValue.trim() === '돌봄';
            
            // 디버깅: 특정 인원 로그 출력
            if (member.id === '[이름]' || member.id === '[이름]' || member.id === '[이름]') {
                console.log(`${member.id} 디버깅:`, {
                    latestIndex: latestIndex,
                    latestDate: dateHeaders[latestIndex],
                    attendance: member.attendance,
                    attendanceAtLatestIndex: attendanceValue,
                    attendanceValueRaw: `"${attendanceValue}"`,
                    isDolbom: isDolbom,
                    lunchValue: member.lunch
                });
            }
            
            return isDolbom;
        }

        // 김밥 개수 계산 함수 ([이름]는 2개, 나머지는 1개)
        // 가장 마지막 날짜 열에 '돌봄'이 있으면 김밥 미계수
        function getLunchCount(member) {
            if (member.lunch !== 'O') return 0;
            
            // 가장 마지막 날짜 열에 '돌봄'이면 0개
            if (isDolbomOnLatestDate(member)) {
                return 0;
            }
            
            // [이름]는 2개로 카운트
            if (member.id === '[이름]') return 2;
            return 1;
        }

        // 팀의 총 김밥 개수 계산
        function calculateTeamLunchCount(members) {
            return members.reduce((total, member) => total + getLunchCount(member), 0);
        }

        function createSheet(team, index) {
            const sheet = document.createElement('div');
            sheet.className = 'sheet';
            sheet.id = `sheet-${index}`;
            sheet.dataset.teamKey = `${team.location}_${team.team}`;

            // 김밥 개수 계산
            const lunchCount = calculateTeamLunchCount(team.members);

            const header = document.createElement('div');
            header.className = 'sheet-header';
            header.innerHTML = `
                <div class="sheet-subtitle">전교인 교리교육 출석부</div>
                <div class="sheet-title">${team.location} - ${team.team}</div>
                <div class="lunch-summary">김밥: ${lunchCount}개</div>
            `;

            const table = document.createElement('table');
            table.className = 'attendance-table';

            // 테이블 헤더
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            headerRow.innerHTML = `
                <th style="width: 45px;">번호</th>
                <th class="lunch-col" style="width: 45px;">김밥</th>
                <th style="width: 200px;">NOTE</th>
                <th style="width: 85px;">ID</th>
                ${dateHeaders.map((date, idx) => `<th class="check-col">${date || `${idx + 1}주차`}</th>`).join('')}
            `;
            thead.appendChild(headerRow);
            table.appendChild(thead);

            // 테이블 바디
            const tbody = document.createElement('tbody');
            team.members.forEach((member, idx) => {
                const row = document.createElement('tr');
                
                // 출석 상태에 따라 표시
                const attendanceCells = member.attendance.map(status => {
                    if (!status || status === '') {
                        return '<td class="check-col"><div class="attendance-box empty"></div></td>';
                    }
                    const statusClass = status === 'O' ? 'present' : 
                                       status === 'X' ? 'absent' : 
                                       'special';
                    return `<td class="check-col"><div class="attendance-box ${statusClass}">${status}</div></td>`;
                }).join('');

                // NOTE 표시
                const noteDisplay = member.note || '';
                const noteClass = noteDisplay === 'O' ? 'present' : 
                                noteDisplay === 'X' ? 'absent' : 
                                'empty';

                // 김밥 여부 표시 ([이름]는 O(2), 나머지는 O, 가장 마지막 날짜 열에 돌봄인 경우 돌봄)
                let lunchDisplay = '';
                if (member.lunch === 'O') {
                    // 가장 마지막 날짜 열에 '돌봄'인 경우 '돌봄' 표시
                    if (isDolbomOnLatestDate(member)) {
                        lunchDisplay = '돌봄';
                    } else {
                        lunchDisplay = member.id === '[이름]' ? 'O(2)' : 'O';
                    }
                } else if (member.lunch === 'X') {
                    lunchDisplay = 'X';
                }
                const lunchClass = lunchDisplay ? (lunchDisplay.includes('O') ? 'present' : lunchDisplay === '돌봄' ? 'special' : 'absent') : 'empty';
                const lunchCellClass = lunchDisplay && lunchDisplay.includes('O') ? 'lunch-col present' : lunchDisplay === '돌봄' ? 'lunch-col absent' : 'lunch-col absent';

                row.innerHTML = `
                    <td>${idx + 1}</td>
                    <td class="check-col ${lunchCellClass}"><div class="attendance-box ${lunchClass}">${lunchDisplay}</div></td>
                    <td class="check-col"><div class="attendance-box ${noteClass}">${noteDisplay}</div></td>
                    <td class="id-col">${member.id}</td>
                    ${attendanceCells}
                `;
                tbody.appendChild(row);
            });
            table.appendChild(tbody);

            sheet.appendChild(header);
            sheet.appendChild(table);

            return sheet;
        }

        function createLunchSheets() {
            const sheets = [];
            
            // 입력된 교역자 김밥 개수 가져오기 (빈 값은 0으로 처리)
            const calvinStaffCount = parseInt(document.getElementById('calvinStaffCount').value) || 0;
            const wesleyStaffCount = parseInt(document.getElementById('wesleyStaffCount').value) || 0;
            
            // 위치별로 팀 그룹화: 칼빈 / 웨슬리&자모영아
            const calvinTeams = teamsData.filter(team => team.location === '칼빈채플');
            const wesleyTeams = teamsData.filter(team => team.location === '웨슬리홀' || team.location === '자모영아실');

            // 칼빈 시트 생성 (교역자 포함)
            if (calvinTeams.length > 0) {
                const staffGroups = calvinStaffCount > 0 ? [{ name: '칼빈', count: calvinStaffCount }] : [];
                sheets.push(createLunchSheet('칼빈채플', calvinTeams, 0, staffGroups));
            }

            // 웨슬리&자모영아 시트 생성 (교역자 포함)
            if (wesleyTeams.length > 0) {
                const staffGroups = wesleyStaffCount > 0 ? [{ name: '웨슬리', count: wesleyStaffCount }] : [];
                sheets.push(createLunchSheet('웨슬리홀 & 자모영아실', wesleyTeams, sheets.length, staffGroups));
            }

            return sheets;
        }

        function createLunchSheet(title, teams, index, staffGroups = []) {
            const sheet = document.createElement('div');
            sheet.className = 'sheet lunch-sheet';
            sheet.id = `lunch-sheet-${index}`;

            // 전체 김밥 개수 계산 (교역자 포함)
            let totalLunchCount = 0;
            staffGroups.forEach(group => {
                totalLunchCount += group.count;
            });
            teams.forEach(team => {
                const lunchCount = calculateTeamLunchCount(team.members);
                totalLunchCount += lunchCount;
            });

            const header = document.createElement('div');
            header.className = 'sheet-header lunch-header';
            
            // 교역자 정보 HTML 생성
            let staffInfoHTML = '';
            if (staffGroups.length > 0 && staffGroups.some(g => g.count > 0)) {
                const totalStaffCount = staffGroups.reduce((sum, g) => sum + g.count, 0);
                staffInfoHTML = `<div class="staff-info">교역자 ${totalStaffCount}개</div>`;
            }
            
            header.innerHTML = `
                <div class="sheet-subtitle">김밥 배분용 계수표</div>
                <div class="sheet-title">${title}</div>
                <div class="lunch-summary">
                    <div>총 ${totalLunchCount}개</div>
                    ${staffInfoHTML}
                </div>
            `;

            // 그리드 컨테이너 생성
            const gridContainer = document.createElement('div');
            gridContainer.className = 'lunch-teams-grid';
            
            // 교역자 박스는 제거하고 일반 조들만 그리드에 추가

            teams.forEach(team => {
                // 팀별 김밥 개수 계산
                const lunchCount = calculateTeamLunchCount(team.members);
                
                // 김밥 먹는 사람과 먹지 않는 사람 분리
                // lunch === 'O'이지만 가장 마지막 날짜 열에 '돌봄'인 사람은 별도로 분리
                const withLunch = team.members.filter(m => m.lunch === 'O' && !isDolbomOnLatestDate(m));
                const withoutLunch = team.members.filter(m => m.lunch !== 'O');
                const dolbomMembers = team.members.filter(m => m.lunch === 'O' && isDolbomOnLatestDate(m));
                
                // 팀 블록 생성
                const teamBlock = document.createElement('div');
                teamBlock.className = 'lunch-team-block';
                
                // 팀 헤더
                const teamHeader = document.createElement('div');
                teamHeader.className = 'lunch-team-header';
                
                // 특수 위치 표시
                let teamNameDisplay = team.team;
                let locationBadge = '';
                if (team.location === '자모영아실') {
                    locationBadge = ' <span style="font-size: 11px;">(자모실)</span>';
                } else if (team.location === '에듀센터') {
                    locationBadge = ' <span style="font-size: 11px;">(에듀)</span>';
                }
                
                teamHeader.innerHTML = `
                    <span class="lunch-team-name">${teamNameDisplay}${locationBadge}</span>
                    <span class="lunch-count">${lunchCount}개</span>
                `;
                teamBlock.appendChild(teamHeader);
                
                // 멤버 리스트 생성 (O가 위, X와 돌봄이 아래)
                const membersList = document.createElement('div');
                membersList.className = 'lunch-members-list';
                
                // 김밥 먹는 사람 먼저 (O)
                withLunch.forEach(member => {
                    const memberRow = document.createElement('div');
                    memberRow.className = 'lunch-member-row';
                    // [이름]는 2개이므로 "O(2)"로 표시, 나머지는 "O"
                    const statusDisplay = member.id === '[이름]' ? 'O(2)' : 'O';
                    memberRow.innerHTML = `
                        <div class="lunch-member-id">${member.id}</div>
                        <div class="lunch-member-status">${statusDisplay}</div>
                    `;
                    membersList.appendChild(memberRow);
                });
                
                // 돌봄 상태인 사람 (돌봄)
                dolbomMembers.forEach(member => {
                    const memberRow = document.createElement('div');
                    memberRow.className = 'lunch-member-row';
                    memberRow.innerHTML = `
                        <div class="lunch-member-id">${member.id}</div>
                        <div class="lunch-member-status">돌봄</div>
                    `;
                    membersList.appendChild(memberRow);
                });
                
                // 김밥 먹지 않는 사람 나중에 (X)
                withoutLunch.forEach(member => {
                    const memberRow = document.createElement('div');
                    memberRow.className = 'lunch-member-row';
                    memberRow.innerHTML = `
                        <div class="lunch-member-id">${member.id}</div>
                        <div class="lunch-member-status">X</div>
                    `;
                    membersList.appendChild(memberRow);
                });
                
                teamBlock.appendChild(membersList);
                
                gridContainer.appendChild(teamBlock);
            });

            sheet.appendChild(header);
            sheet.appendChild(gridContainer);

            return sheet;
        }

        function displayControls() {
            document.getElementById('controls').style.display = 'flex';
            document.getElementById('fileInfo').style.display = 'block';
            
            // 여러 파일인 경우 파일명 표시
            const files = document.getElementById('csvFile').files;
            if (files.length === 1) {
                document.getElementById('fileName').textContent = files[0].name;
            } else {
                document.getElementById('fileName').textContent = `${files.length}개 파일 (${Array.from(files).map(f => f.name).join(', ')})`;
            }
            
            if (currentMode === 'attendance') {
                document.getElementById('teamCount').textContent = teamsData.length;
                
                const selector = document.getElementById('teamSelector');
                selector.innerHTML = '';
                selector.style.display = 'flex';

                teamsData.forEach((team, index) => {
                    const checkbox = document.createElement('div');
                    checkbox.className = 'team-checkbox';
                    checkbox.innerHTML = `
                        <input type="checkbox" id="team-${index}" checked onchange="updateSheetVisibility(${index})">
                        <label for="team-${index}">${team.location} - ${team.team} (${team.members.length}명)</label>
                    `;
                    selector.appendChild(checkbox);
                });
            } else {
                // 김밥 계수 모드에서는 조 선택기 숨김
                document.getElementById('teamCount').textContent = '김밥 계수 모드';
                document.getElementById('teamSelector').style.display = 'none';
            }
        }

        function updateSheetVisibility(index) {
            if (currentMode === 'lunch') return; // 김밥 계수 모드에서는 사용 안 함
            
            const checkbox = document.getElementById(`team-${index}`);
            const sheet = document.getElementById(`sheet-${index}`);
            if (checkbox && sheet) {
                if (checkbox.checked) {
                    sheet.classList.remove('hidden');
                } else {
                    sheet.classList.add('hidden');
                }
            }
        }

        function selectAllTeams() {
            if (currentMode === 'lunch') return; // 김밥 계수 모드에서는 사용 안 함
            
            teamsData.forEach((team, index) => {
                const checkbox = document.getElementById(`team-${index}`);
                if (checkbox) {
                    checkbox.checked = true;
                    updateSheetVisibility(index);
                }
            });
        }

        function deselectAllTeams() {
            if (currentMode === 'lunch') return; // 김밥 계수 모드에서는 사용 안 함
            
            teamsData.forEach((team, index) => {
                const checkbox = document.getElementById(`team-${index}`);
                if (checkbox) {
                    checkbox.checked = false;
                    updateSheetVisibility(index);
                }
            });
        }

        function printAll() {
            if (currentMode === 'lunch') {
                // 김밥 계수 모드: body에 lunch-mode 클래스 추가하여 세로 방향으로 인쇄
                document.body.classList.add('lunch-mode');
                
                // 모든 김밥 시트 표시
                const lunchSheets = document.querySelectorAll('[id^="lunch-sheet-"]');
                lunchSheets.forEach(sheet => {
                    sheet.classList.remove('hidden');
                });
            } else {
                // 일반 출석부 모드: lunch-mode 클래스 제거
                document.body.classList.remove('lunch-mode');
                
                // 모든 출석부 시트 표시
                teamsData.forEach((team, index) => {
                    const sheet = document.getElementById(`sheet-${index}`);
                    if (sheet) {
                        sheet.classList.remove('hidden');
                    }
                });
            }
            
            setTimeout(() => {
                window.print();
                // 인쇄 후 클래스 복원
                if (currentMode !== 'lunch') {
                    document.body.classList.remove('lunch-mode');
                }
            }, 100);
        }

        function printSelected() {
            if (currentMode === 'lunch') {
                // 김밥 계수 모드에서는 전체 인쇄와 동일
                printAll();
                return;
            }
            
            // 일반 출석부 모드: lunch-mode 클래스 제거
            document.body.classList.remove('lunch-mode');
            
            // 선택된 시트만 표시하고 나머지 숨김
            teamsData.forEach((team, index) => {
                const checkbox = document.getElementById(`team-${index}`);
                const sheet = document.getElementById(`sheet-${index}`);
                if (checkbox && sheet) {
                    if (checkbox.checked) {
                        sheet.classList.remove('hidden');
                    } else {
                        sheet.classList.add('hidden');
                    }
                }
            });

            setTimeout(() => {
                window.print();
                // 인쇄 후 클래스 복원
                document.body.classList.remove('lunch-mode');
            }, 100);
        }

        // PDF 다운로드 함수 (화면 전체를 하나의 PDF로)
        async function downloadAsPDF(button) {
            const { jsPDF } = window.jspdf;
            const container = document.getElementById('attendanceSheets');
            
            if (teamsData.length === 0) {
                alert('다운로드할 출석부가 없습니다.');
                return;
            }

            // 로딩 표시
            const originalText = button.textContent;
            button.textContent = '⏳ PDF 생성 중...';
            button.disabled = true;

            try {
                // 전체 컨테이너를 이미지로 변환
                const canvas = await html2canvas(container, {
                    scale: 2,
                    useCORS: true,
                    logging: false,
                    backgroundColor: '#ffffff',
                    windowWidth: container.scrollWidth,
                    windowHeight: container.scrollHeight
                });
                
                const imgData = canvas.toDataURL('image/png');
                
                // PDF 크기 계산 (A4 세로 방향)
                const pdfWidth = 210; // A4 너비 (mm)
                const pdfHeight = 297; // A4 높이 (mm)
                const imgWidth = pdfWidth - 20; // 좌우 여백 10mm
                const imgHeight = (canvas.height * imgWidth) / canvas.width;
                
                // 이미지가 한 페이지보다 길면 여러 페이지로 분할
                const pdf = new jsPDF('p', 'mm', 'a4');
                let heightLeft = imgHeight;
                let position = 0;
                
                // 첫 페이지
                pdf.addImage(imgData, 'PNG', 10, 10, imgWidth, imgHeight);
                heightLeft -= (pdfHeight - 20);
                
                // 추가 페이지
                while (heightLeft > 0) {
                    position = heightLeft - imgHeight;
                    pdf.addPage();
                    pdf.addImage(imgData, 'PNG', 10, position + 10, imgWidth, imgHeight);
                    heightLeft -= (pdfHeight - 20);
                }
                
                // 파일명 생성 (현재 날짜 + 모드)
                const date = new Date().toISOString().split('T')[0];
                const mode = currentMode === 'lunch' ? '김밥계수' : '출석부';
                pdf.save(`교리교육_${mode}_전체_${date}.pdf`);
                
            } catch (error) {
                console.error('PDF 생성 오류:', error);
                alert('PDF 생성 중 오류가 발생했습니다.');
            } finally {
                button.textContent = originalText;
                button.disabled = false;
            }
        }

        // 이미지 다운로드 함수 (화면 전체를 하나의 이미지로)
        async function downloadAsImage(button) {
            const container = document.getElementById('attendanceSheets');
            
            if (teamsData.length === 0) {
                alert('다운로드할 출석부가 없습니다.');
                return;
            }

            // 로딩 표시
            const originalText = button.textContent;
            button.textContent = '⏳ 이미지 생성 중...';
            button.disabled = true;

            try {
                // 전체 컨테이너를 이미지로 변환
                const canvas = await html2canvas(container, {
                    scale: 2,
                    useCORS: true,
                    logging: false,
                    backgroundColor: '#ffffff',
                    windowWidth: container.scrollWidth,
                    windowHeight: container.scrollHeight
                });
                
                // 이미지 다운로드
                const link = document.createElement('a');
                const date = new Date().toISOString().split('T')[0];
                const mode = currentMode === 'lunch' ? '김밥계수' : '출석부';
                
                link.download = `교리교육_${mode}_전체_${date}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
            } catch (error) {
                console.error('이미지 생성 오류:', error);
                alert('이미지 생성 중 오류가 발생했습니다.');
            } finally {
                button.textContent = originalText;
                button.disabled = false;
            }
        }

        // 파일 드래그 앤 드롭 지원 (여러 파일 가능)
        const container = document.querySelector('.container');
        container.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
            container.style.border = '2px dashed #4CAF50';
        });

        container.addEventListener('dragleave', (e) => {
            e.preventDefault();
            e.stopPropagation();
            container.style.border = 'none';
        });

        container.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            container.style.border = 'none';

            const files = e.dataTransfer.files;
            
            // CSV 파일만 필터링
            const csvFiles = Array.from(files).filter(f => f.name.endsWith('.csv'));
            
            if (csvFiles.length > 0) {
                // FileList를 직접 할당할 수 없으므로 DataTransfer 객체 사용
                const dataTransfer = new DataTransfer();
                csvFiles.forEach(file => dataTransfer.items.add(file));
                document.getElementById('csvFile').files = dataTransfer.files;
                
                loadCSV();
            } else {
                alert('CSV 파일을 드롭해주세요.');
            }
        });
    </script>
